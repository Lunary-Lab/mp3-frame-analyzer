name: CI
on:
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  security:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  all-checks:
    name: All checks
    if: always()
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

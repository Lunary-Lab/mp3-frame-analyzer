pre-commit:
  parallel: true
  commands:
    format:
      glob: '**/*.{ts,js,mjs,json,md,yml,yaml}'
      run: node node_modules/prettier/bin/prettier.cjs --check {staged_files}
    secrets:
      run: bash scripts/scan-staged-secrets.sh

pre-push:
  commands:
    quality:
      run: npm run check

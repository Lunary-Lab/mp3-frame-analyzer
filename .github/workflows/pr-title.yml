name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Release PR whose head is the dispatched workflow ref
        required: true
        type: string

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commit PR title
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Only inspect PR metadata. Never check out or execute pull-request code here.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            docs
            style
            refactor
            test
            build
            ci
            chore
            revert
      - name: Validate the exact queued candidate using metadata only
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const repo = process.env.GH_REPO;
          assert.match(repo, /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/);
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          assert.equal(event.action, 'checks_requested');
          assert.equal(event.repository.full_name, repo);
          const group = event.merge_group;
          assert.equal(group.base_ref, 'refs/heads/main');
          assert.equal(group.head_sha, process.env.GITHUB_SHA);
          assert.match(group.head_sha, /^[0-9a-f]{40}$/);
          assert.match(group.base_sha, /^[0-9a-f]{40}$/);
          const [owner, name] = repo.split('/');
          const query = `query($owner:String!,$name:String!,$endCursor:String) {
            repository(owner:$owner,name:$name) {
              pullRequests(states:OPEN,baseRefName:"main",first:100,after:$endCursor) {
                pageInfo { hasNextPage endCursor }
                nodes { number title state baseRefName headRefOid repository { nameWithOwner }
                  mergeQueueEntry { headCommit { oid } baseCommit { oid } }
                }
              }
            }
          }`;
          const pages = JSON.parse(execFileSync('gh', [
            'api', 'graphql', '--paginate', '--slurp', '-f', `query=${query}`,
            '-f', `owner=${owner}`, '-f', `name=${name}`,
          ], { encoding: 'utf8' }));
          assert.ok(Array.isArray(pages) && pages.length > 0, 'Queue metadata unavailable');
          const prs = pages.flatMap((page) => {
            assert.ok(!page.errors, 'Queue metadata query failed');
            const nodes = page.data.repository.pullRequests?.nodes;
            assert.ok(Array.isArray(nodes), 'Pull request metadata unavailable');
            return nodes;
          });
          const matches = prs.filter((pr) => pr.mergeQueueEntry?.headCommit?.oid === group.head_sha);
          assert.equal(matches.length, 1, 'Exactly one current queue candidate is required');
          const pr = matches[0];
          const entry = pr.mergeQueueEntry;
          assert.equal(entry.baseCommit?.oid, group.base_sha, 'Queue candidate base changed');
          assert.equal(pr.state, 'OPEN');
          assert.equal(pr.baseRefName, 'main');
          assert.equal(pr.repository.nameWithOwner, repo);
          assert.ok(Number.isSafeInteger(pr.number) && pr.number > 0);
          assert.match(pr.headRefOid, /^[0-9a-f]{40}$/);
          assert.match(pr.title, /^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(?:\([^\r\n()]+\))?!?: \S[^\r\n]*$/, 'Queued PR title must be a Conventional Commit');
          JS
      - name: Validate a dispatched release PR using metadata only
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const { GH_REPO: repo, PR_NUMBER: number } = process.env;
          assert.match(number, /^[1-9]\d*$/);
          const pr = JSON.parse(execFileSync('gh', ['api', `repos/${repo}/pulls/${number}`], { encoding: 'utf8' }));
          assert.equal(pr.base.ref, 'main');
          assert.equal(pr.head.repo.full_name, repo);
          assert.equal(pr.head.sha, process.env.GITHUB_SHA, 'Dispatch must validate the current PR head');
          assert.match(pr.title, /^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(?:\([^\r\n()]+\))?!?: \S[^\r\n]*$/, 'PR title must use an accepted Conventional Commit type and nonempty subject');
          JS

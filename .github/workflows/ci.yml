name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_mutation:
        description: Force a fresh full mutation run (no result reuse)
        type: boolean
        default: true
  schedule:
    - cron: '23 5 * * 1'
  workflow_call:
    outputs:
      release_artifact_id:
        description: Immutable ID of the runtime artifact verified by this invocation
        value: ${{ jobs.package.outputs.release_artifact_id }}
      release_artifact_digest:
        description: SHA-256 archive digest reported by the artifact service
        value: ${{ jobs.package.outputs.release_artifact_digest }}
      release_run_attempt:
        description: Workflow attempt that produced the tested runtime artifact
        value: ${{ jobs.package.outputs.release_run_attempt }}
    inputs:
      ref:
        description: Exact commit to validate for a release
        type: string
        default: ''
      release_tag:
        description: Expected stable vX.Y.Z tag, when validating a release
        type: string
        default: ''

permissions:
  contents: read

env:
  NODE_OPTIONS: ''
  NODE_PATH: ''
  NODE_COMPILE_CACHE: ''
  NODE_DISABLE_COMPILE_CACHE: '1'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OTEL_SDK_DISABLED: 'true'

# Scheduled/full-manual runs use unique groups: cancel=false alone still replaces pending runs.
# Release validation is isolated; the separate publisher retains its publication lock.
concurrency:
  group: ci-${{ (inputs.ref != '' || inputs.release_tag != '') && format('release-{0}-{1}', inputs.release_tag, inputs.ref) || github.event_name == 'schedule' && format('scheduled-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && inputs.full_mutation == true && format('full-{0}', github.run_id) || format('validation-{0}', github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && format('fork-pr-{0}', github.event.pull_request.number) || github.head_ref != '' && format('refs/heads/{0}', github.head_ref) || github.ref) }}
  cancel-in-progress: ${{ inputs.ref == '' && inputs.release_tag == '' && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full_mutation == true) }}

jobs:
  governance:
    name: Repository governance
    uses: ./.github/workflows/governance.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: npm run format:check

  lint:
    name: Lint and workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: npm run lint
      - uses: ./.github/actions/setup-zizmor
      - name: Require immutable workflow dependencies with native negative controls
        run: node scripts/verify-workflow-pins.mjs "${RUNNER_TEMP}/zizmor-tool/zizmor"
      - uses: ./.github/actions/setup-go-tool
        with:
          tool: actionlint
      - name: Lint native workflow syntax without compatibility bypasses
        run: actionlint -color

  types:
    name: TypeScript (current and legacy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: npm run typecheck && npm run typecheck:legacy

  unit:
    name: Runtime unit and coverage (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: npm run test:coverage
      - name: Retain coverage-report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Node ${{ matrix.node }} and npm ${{ matrix.npm }} compatibility
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '26'
            version: '26.12.1'
            npm: '11.19.0'
          - node: '24'
            version: '24.22.1'
            npm: '11.9.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          node: ${{ matrix.version }}
          npm: ${{ matrix.npm }}
      - run: npm run check
        if: matrix.node == '26'
      - run: npm run build && npm test
        if: matrix.npm == '11.9.0'

  tooling:
    name: Tooling and policy regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: npm run test:mutation-policy && npm run test:tooling

  mutation-cache:
    name: Mutation cache regression (complete campaign)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: npm run test:mutation-cache:integration
      - name: Retain mutation-cache-verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-cache-verification
          path: reports/mutation-cache-validation/
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: Full parser mutation gate (100% adjusted)
    permissions:
      contents: read
      actions: read
    needs: [types, unit, tooling]
    uses: ./.github/workflows/mutation.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      full: ${{ github.event_name == 'schedule' || inputs.ref != '' || inputs.release_tag != '' || inputs.full_mutation == true }}
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.ref == '' && inputs.release_tag == '' }}

  mutation-pure:
    name: Pure runtime mutation (100%)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Mutate pure runtime policies freshly within two minutes
        run: timeout --signal=TERM --kill-after=5s 115s npm run mutation:pure
      - name: Retain pure-runtime-mutation-report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pure-runtime-mutation-report
          path: reports/mutation-pure/
          if-no-files-found: error
          retention-days: 14

  encoder:
    name: Genuine encoder provenance (LAME 3.100)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-verified
      - uses: ./.github/actions/setup-lame-verified
        id: encoder
      - name: Regenerate, decode and verify every fixed encoder fixture
        env:
          LAME_BINARY: ${{ steps.encoder.outputs.binary }}
        run: node scripts/encoder-fixtures.mjs

  npm-audit:
    name: npm dependency CVEs (${{ matrix.scope }}, moderate+)
    strategy:
      fail-fast: false
      matrix:
        scope: [production, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          install: 'false'
      - name: Audit production dependencies
        if: matrix.scope == 'production'
        run: npm run audit:production
      - name: Audit the complete build and test dependency tree
        if: matrix.scope == 'full'
        run: npm run audit:dependencies

  trivy:
    name: Trivy dependency CVEs (full lock, HIGH/CRITICAL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-verified
      - uses: ./.github/actions/setup-trivy
      - run: node scripts/trivy-gate.mjs "${RUNNER_TEMP}/trivy-tool/trivy" full

  trivy-release:
    name: Trivy dependency CVEs (tested release, HIGH/CRITICAL)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-verified
      - name: Require the exact producer artifact identity before download
        env:
          ARTIFACT_ID: ${{ needs.package.outputs.release_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.package.outputs.release_artifact_digest }}
          ARTIFACT_ATTEMPT: ${{ needs.package.outputs.release_run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const { ARTIFACT_ID: id, ARTIFACT_DIGEST: digest, ARTIFACT_ATTEMPT: attempt } = process.env;
          assert.match(id ?? '', /^[1-9][0-9]*$/, 'Missing single immutable artifact ID');
          assert.match(digest ?? '', /^[a-f0-9]{64}$/, 'Missing artifact service digest');
          assert.match(attempt ?? '', /^[1-9][0-9]*$/, 'Missing producer attempt');
          assert.ok(Number.isSafeInteger(Number(id)) && Number.isSafeInteger(Number(attempt)));
          assert.ok(Number(attempt) <= Number(process.env.GITHUB_RUN_ATTEMPT), 'Future producer attempt');
          NODE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.release_artifact_id }}
          path: release
          digest-mismatch: error
      - uses: ./.github/actions/setup-trivy
      - name: Scan the exact tested artifact production lock without installing packages
        run: node scripts/trivy-gate.mjs "${RUNNER_TEMP}/trivy-tool/trivy" release
        env:
          SOURCE_COMMIT: ${{ inputs.ref || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}

  secrets:
    name: Secrets (complete Git history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-tool
        with:
          tool: betterleaks
      - name: Scan entire Git history for secrets
        run: betterleaks git . --no-banner

  architecture:
    name: Runtime architecture SAST (ESLint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Prove native architecture findings, coverage and suppression resistance
        run: npm run test:sast
      - name: Enforce fixed runtime architecture policy without project configuration or ignores
        run: npm run sast:runtime

  fuzz:
    name: Fuzz regression and bounded resources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: npm run build
      - run: node scripts/fuzz-parser.mjs && npm run test:fuzz-tooling
      - run: node scripts/run-jazzer.mjs --regression
      - run: node scripts/run-jazzer.mjs
      - name: Verify bounded memory and valid HTTP load
        shell: bash
        run: |
          mkdir -p reports/performance
          node --expose-gc scripts/memory-benchmark.mjs | tee reports/performance/memory.json
          node scripts/http-performance.mjs | tee reports/performance/http.json
      - name: Retain performance-measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-measurements
          path: reports/performance/
          if-no-files-found: error
          retention-days: 14

      - name: Upload fuzz crashes when tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/crashes/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Build, artifact verification and real runtime smoke
    needs: [types, unit]
    outputs:
      release_artifact_id: ${{ steps.release-assets.outputs.artifact-id }}
      release_artifact_digest: ${{ steps.release-assets.outputs.artifact-digest }}
      release_run_attempt: ${{ github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: npm run build
      - run: npm run verify:version && npm run package:release
        env:
          SOURCE_COMMIT: ${{ inputs.ref || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Install and test the unpacked production-only runtime
        run: npm run test:artifact
        env:
          SOURCE_COMMIT: ${{ inputs.ref || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Preserve the same tested artifact bytes
        id: release-assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  all-checks:
    name: All checks
    if: always()
    needs:
      [
        format,
        lint,
        types,
        unit,
        compatibility,
        tooling,
        mutation-cache,
        mutation,
        mutation-pure,
        encoder,
        npm-audit,
        trivy,
        trivy-release,
        secrets,
        architecture,
        fuzz,
        package,
        governance,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every declared job; no skipped or missing evidence is accepted
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const expected = [
            'format', 'lint', 'types', 'unit', 'compatibility', 'tooling', 'mutation-cache',
            'mutation', 'mutation-pure', 'encoder', 'npm-audit', 'trivy', 'trivy-release', 'secrets', 'architecture', 'fuzz', 'package', 'governance',
          ];
          const jobs = JSON.parse(process.env.RESULTS);
          assert.ok(jobs && typeof jobs === 'object' && !Array.isArray(jobs), 'Missing job evidence');
          assert.deepEqual(Object.keys(jobs).sort(), expected.sort(), 'Incomplete or unexpected job inventory');
          const failed = expected.filter((name) => jobs[name]?.result !== 'success');
          assert.deepEqual(failed, [], `Required jobs did not pass: ${failed.join(', ')}`);
          JS

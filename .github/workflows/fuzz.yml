name: Extended fuzz campaign

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: ''
  NODE_PATH: ''
  NODE_COMPILE_CACHE: ''
  NODE_DISABLE_COMPILE_CACHE: '1'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-verified
      - run: node scripts/bootstrap-npm.mjs 11.19.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          cache-dependency-path: package-lock.json
      - run: |
          node scripts/verify-npm-lock.mjs
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=never
      - name: Replay tracked fuzz cases
        run: npm run fuzz:regression
      - name: Run extended coverage-guided campaign (4 minutes total)
        run: npm run fuzz:extended
      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: |
            fuzz/crashes/
            .fuzz-corpus/
          if-no-files-found: warn
          retention-days: 14

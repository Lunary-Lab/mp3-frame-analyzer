            if (release.draft || release.prerelease || !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(release.tag_name)) return false;
            const parts = release.tag_name.slice(1).split('.').map(BigInt);
            for (let i = 0; i < 3; i++) if (parts[i] !== target[i]) return parts[i] > target[i];
            return false;
          });

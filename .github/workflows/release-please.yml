name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      prs: ${{ steps.release.outputs.prs }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # No checkout or repository code runs in this write-enabled job.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  release-pr-status:
    needs: version
    if: needs.version.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    steps:
      # Dispatched job checks cannot satisfy PR rulesets. Report the native path
      # instead of launching an expensive duplicate validation that cannot admit it.
      - name: Report generated release PR and native validation next step
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ needs.version.outputs.prs }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const repo = process.env.GH_REPO;
          assert.match(repo, /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/);
          const prs = JSON.parse(process.env.RELEASE_PRS);
          assert.ok(Array.isArray(prs) && prs.length > 0, 'Release PR output is empty');
          const rows = [];
          for (const pr of prs) {
            assert.equal(pr.baseBranchName, 'main');
            assert.match(pr.headBranchName, /^release-please--branches--main(?:--.*)?$/);
            assert.ok(Number.isSafeInteger(pr.number) && pr.number > 0, 'Invalid release PR number');
            const current = JSON.parse(execFileSync('gh', ['api', `repos/${repo}/pulls/${pr.number}`], { encoding: 'utf8' }));
            assert.equal(current.number, pr.number);
            assert.equal(current.state, 'open');
            assert.equal(current.base.ref, 'main');
            assert.equal(current.head.repo.full_name, repo);
            assert.equal(current.head.ref, pr.headBranchName);
            assert.match(current.head.sha, /^[0-9a-f]{40}$/);
            rows.push(`- [PR #${pr.number}](https://github.com/${repo}/pull/${pr.number}) at \`${current.head.sha}\``);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Release PR validation', '', ...rows, '',
            'Review the current release PR head. A maintainer can close and reopen the PR once to trigger native CI and metadata-only title validation.',
            'Review any Approve workflows to run prompt. Confirm All checks and Conventional Commit PR title pass in the PR checks before merging.',
            'After the reviewed merge queue configuration is activated, add the PR to the native main merge queue. A branch behind main does not need Update branch: GitHub validates the integrated queue candidate.',
            'Queueing uses the maintainer account; GITHUB_TOKEN cannot enqueue it. A real Release Please head change or a failed check needs review and requeueing.',
            'workflow_dispatch checks do not satisfy PR rulesets. This summary does not approve workflows, and workflow approval does not merge or publish.',
            'Final publication still requires the separate owner approval in the release environment.', '',
          ].join('\n'));
          JS

  release:
    needs: version
    if: needs.version.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      # Dispatch at the tag itself: the invocation SHA then identifies the
      # actual source used by the build and standard provenance attestation.
      - name: Validate and publish the created draft from its exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const { GH_REPO: repo, RELEASE_TAG: tag, RELEASE_SHA: sha } = process.env;
          assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.match(sha, /^[0-9a-f]{40}$/);
          execFileSync('gh', ['workflow', 'run', 'publish-release.yml', '--repo', repo, '--ref', tag, '-f', `tag=${tag}`, '-f', `sha=${sha}`], { stdio: 'inherit' });
          JS

name: Main policy audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read

env:
  NODE_OPTIONS: ''
  NODE_PATH: ''
  NODE_COMPILE_CACHE: ''
  NODE_DISABLE_COMPILE_CACHE: '1'

jobs:
  audit:
    name: Main policy audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Detective metadata-only control, not branch enforcement. No PR code,
      # npm dependencies, lifecycle scripts, write token or approval requirement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/main-policy-audit*.mjs
            scripts/bootstrap-node.sh
            .github/actions/setup-node-verified/action.yml
            .github/security/node-archives.sha256
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-node-verified
      - name: Audit squash checks as they stood before each merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
        run: node scripts/main-policy-audit.mjs
